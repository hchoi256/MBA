services:
  mba:
    build:
      context: .
      args:
        MAX_JOBS: "8"
    image: mba:torch2.2-cu121
    working_dir: /workspace
    ipc: host
    shm_size: "192gb"
    stdin_open: true
    tty: true
    gpus: all
    environment:
      HF_HOME: /workspace/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      ACCELERATE_USE_DEEPSPEED: "false"
      DISABLE_DEEPSPEED: "1"
      CUDA_MODULE_LOADING: LAZY
      PYTHONPATH: /workspace:/workspace/FActScore
      NLTK_DATA: /opt/nltk_data
    volumes:
      - ${mba_WORKSPACE:-.}:/workspace
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/workspace/.cache/huggingface
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
